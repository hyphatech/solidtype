# Checks are defined in the Makefile. 5.5 is the supported minimum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      # The plugin, the generators and the islands' tests run on Bun.
      - uses: oven-sh/setup-bun@v2
      - run: opam install . --deps-only --with-test --with-dev-setup -y
      - run: bun install --frozen-lockfile
      # Use setup-ocaml's switch instead of the Makefile's.
      - run: make lint OPAM="opam exec --"
      - run: make test OPAM="opam exec --"

  # The oldest versions the opam file allows, as opam-repository checks.
  lower-bounds:
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: +removed,+count[version-lag,solution]
      OPAMFIXUPCRITERIA: +removed,+count[version-lag,solution]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      - uses: oven-sh/setup-bun@v2
      - run: opam install . --deps-only --with-test -y
      - run: bun install --frozen-lockfile
      - run: opam list --installed --columns=name,version
      - run: opam exec -- dune build -p solidtype,ppx_solidtype @install
      - run: make test OPAM="opam exec --"
